name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-and-test:
    name: Build debug APK & run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # BuildConfig keys come from local.properties. Prefer GitHub Actions
      # Secrets when set; otherwise use placeholders so PRs compile without
      # credentials. Placeholders are treated as "not configured" at runtime.
      - name: Create local.properties for CI
        env:
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          umask 077
          printf 'GNEWS_API_KEY=%s\nGEMINI_API_KEY=%s\n' \
            "${GNEWS_API_KEY:-CI_PLACEHOLDER}" \
            "${GEMINI_API_KEY:-CI_PLACEHOLDER}" > local.properties

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
