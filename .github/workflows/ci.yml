name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-and-test:
    name: Build debug APK & run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Pinned to the same version as gradle/wrapper/gradle-wrapper.properties.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # BuildConfig keys come from local.properties. Prefer GitHub Actions
      # Secrets when set; otherwise use placeholders so the public repo builds
      # without committed credentials. Placeholders are treated as "not
      # configured" at runtime and the app falls back to cache/mock.
      - name: Create local.properties for CI
        env:
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "GNEWS_API_KEY=${GNEWS_API_KEY:-CI_PLACEHOLDER}" > local.properties
          echo "GEMINI_API_KEY=${GEMINI_API_KEY:-CI_PLACEHOLDER}" >> local.properties

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
