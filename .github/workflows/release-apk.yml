name: Release APK

# Builds Trendora and attaches the APK to a GitHub Release when a release is published.
# API keys come ONLY from repository Secrets — never committed to source.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build & upload Trendora APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Pinned to the same version as gradle/wrapper/gradle-wrapper.properties.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties from GitHub Secrets
        env:
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GNEWS_API_KEY" ] || [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GNEWS_API_KEY and GEMINI_API_KEY must be set as repository Secrets before publishing a release."
            exit 1
          fi
          # Values are written only on the ephemeral CI runner — never logged.
          {
            echo "GNEWS_API_KEY=${GNEWS_API_KEY}"
            echo "GEMINI_API_KEY=${GEMINI_API_KEY}"
          } > local.properties

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Name release APK
        id: apk
        run: |
          # Tag examples: v1.0.0, 1.0.0 → Trendora-v1.0.0.apk
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            v*) VERSION="$TAG" ;;
            *)  VERSION="v${TAG}" ;;
          esac
          OUT_NAME="Trendora-${VERSION}.apk"
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk "release-assets/${OUT_NAME}"
          echo "asset_path=release-assets/${OUT_NAME}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${OUT_NAME}" >> "$GITHUB_OUTPUT"
          ls -lh "release-assets/${OUT_NAME}"

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.asset_path }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
